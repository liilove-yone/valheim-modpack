```yaml
name: Build Valheim Standalone Modpack

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  GAME: valheim
  THUNDERSTORE_PROFILE_API: https://thunderstore.io/api/experimental/legacyprofile/get

jobs:
  build:
    name: Build standalone Valheim modpack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            unzip \
            zip \
            python3 \
            python3-pip

          python3 -m pip install --break-system-packages pyyaml

      - name: Read r2modman profile code
        id: profile
        shell: bash
        run: |
          set -euo pipefail

          CODE="$(tr -d '[:space:]' < profile-code.txt)"

          if [[ ! "$CODE" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "ERROR: Invalid r2modman profile code"
            echo "Got: $CODE"
            exit 1
          fi

          echo "Profile code: $CODE"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Download r2modman profile
        env:
          PROFILE_CODE: ${{ steps.profile.outputs.code }}
        run: |
          set -euxo pipefail

          mkdir -p work
          mkdir -p pack

          URL="${THUNDERSTORE_PROFILE_API}/${PROFILE_CODE}/"

          echo "Downloading r2modman profile..."
          echo "$URL"

          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 120 \
            "$URL" \
            -o work/profile-response.txt

          if ! grep -q '^#r2modman' work/profile-response.txt; then
            echo "ERROR: Thunderstore did not return an r2modman profile."
            echo
            cat work/profile-response.txt
            exit 1
          fi

          echo "Profile received."

          tail -n 1 work/profile-response.txt \
            | base64 --decode \
            > work/profile.r2z

          echo "Profile archive:"
          ls -lh work/profile.r2z

      - name: Extract profile
        run: |
          set -euxo pipefail

          mkdir -p work/profile

          unzip -q work/profile.r2z -d work/profile

          echo "Profile contents:"
          find work/profile -maxdepth 3 -type f -print | sort

          if [[ ! -f work/profile/export.r2x ]]; then
            echo "ERROR: export.r2x was not found."
            exit 1
          fi

          echo
          echo "export.r2x:"
          cat work/profile/export.r2x

      - name: Download all profile mods
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import shutil
          import sys
          import tempfile
          import time
          import urllib.request
          import zipfile
          from pathlib import Path

          import yaml

          PROFILE = Path("work/profile/export.r2x")
          PACK = Path("pack")
          DOWNLOADS = Path("work/downloads")

          PACK.mkdir(parents=True, exist_ok=True)
          DOWNLOADS.mkdir(parents=True, exist_ok=True)

          print("=" * 70)
          print("Reading r2modman profile")
          print("=" * 70)

          with PROFILE.open("r", encoding="utf-8") as f:
              profile = yaml.safe_load(f)

          if not isinstance(profile, dict):
              raise RuntimeError("Invalid export.r2x")

          profile_name = profile.get(
              "profileName",
              "Valheim Modpack"
          )

          mods = profile.get("mods", [])

          print(f"Profile: {profile_name}")
          print(f"Mods listed: {len(mods)}")
          print()

          if not mods:
              raise RuntimeError(
                  "No mods were found in the profile."
              )

          def download(url, retries=8):
              last_error = None

              for attempt in range(1, retries + 1):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent":
                                  "GitHubActions-Valheim-ModpackBuilder/1.0"
                          }
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=120
                      ) as response:
                          return response.read()

                  except Exception as e:
                      last_error = e

                      print(
                          f"Download failed "
                          f"({attempt}/{retries}): {e}"
                      )

                      if attempt < retries:
                          time.sleep(
                              min(attempt * 3, 20)
                          )

              raise RuntimeError(
                  f"Download failed: {url}\n"
                  f"{last_error}"
              )

          def safe_extract(zip_file, destination):
              destination = Path(destination).resolve()

              for member in zip_file.infolist():
                  target = (
                      destination / member.filename
                  ).resolve()

                  if (
                      not str(target).startswith(
                          str(destination) + os.sep
                      )
                      and target != destination
                  ):
                      raise RuntimeError(
                          f"Unsafe ZIP path: "
                          f"{member.filename}"
                      )

              zip_file.extractall(destination)

          def merge_tree(source, destination):
              source = Path(source)
              destination = Path(destination)

              destination.mkdir(
                  parents=True,
                  exist_ok=True
              )

              for item in source.iterdir():
                  target = destination / item.name

                  if item.is_dir():
                      merge_tree(item, target)
                  else:
                      target.parent.mkdir(
                          parents=True,
                          exist_ok=True
                      )

                      shutil.copy2(
                          item,
                          target
                      )

          def install_package(package_zip):
              temp = Path(
                  tempfile.mkdtemp(
                      prefix="valheim-mod-"
                  )
              )

              try:
                  with zipfile.ZipFile(package_zip) as zf:
                      safe_extract(
                          zf,
                          temp
                      )

                  # Package contains BepInEx directly.
                  if (temp / "BepInEx").is_dir():
                      print("  Layout: BepInEx/")
                      merge_tree(
                          temp / "BepInEx",
                          PACK / "BepInEx"
                      )
                      return

                  # Package contains BepInEx subdirectories directly.
                  subdirs = (
                      "plugins",
                      "patchers",
                      "core",
                      "monomod"
                  )

                  if any(
                      (temp / d).is_dir()
                      for d in subdirs
                  ):
                      print(
                          "  Layout: BepInEx subdirectories"
                      )

                      merge_tree(
                          temp,
                          PACK / "BepInEx"
                      )
                      return

                  # Look for a nested package directory.
                  directories = [
                      p for p in temp.iterdir()
                      if p.is_dir()
                  ]

                  for directory in directories:
                      nested_bepinex = (
                          directory / "BepInEx"
                      )

                      nested_layout = any(
                          (directory / d).is_dir()
                          for d in subdirs
                      )

                      if (
                          nested_bepinex.is_dir()
                          or nested_layout
                      ):
                          print(
                              "  Layout: nested package"
                          )

                          if nested_bepinex.is_dir():
                              merge_tree(
                                  nested_bepinex,
                                  PACK / "BepInEx"
                              )
                          else:
                              merge_tree(
                                  directory,
                                  PACK / "BepInEx"
                              )

                          return

                  # Otherwise copy package root.
                  print("  Layout: package root")

                  merge_tree(
                      temp,
                      PACK
                  )

              finally:
                  shutil.rmtree(
                      temp,
                      ignore_errors=True
                  )

          total = len(mods)

          for index, mod in enumerate(
              mods,
              start=1
          ):
              if not isinstance(mod, dict):
                  print(
                      f"Skipping malformed mod: {mod}"
                  )
                  continue

              name = str(
                  mod.get("name", "")
              ).strip()

              version = mod.get(
                  "version",
                  {}
              )

              if not name:
                  print(
                      "Skipping mod without name"
                  )
                  continue

              if not isinstance(version, dict):
                  raise RuntimeError(
                      f"Invalid version for {name}"
                  )

              try:
                  major = int(version["major"])
                  minor = int(version["minor"])
                  patch = int(version["patch"])
              except Exception:
                  raise RuntimeError(
                      f"Invalid version for {name}: "
                      f"{version}"
                  )

              version_string = (
                  f"{major}.{minor}.{patch}"
              )

              parts = name.split("-", 1)

              if len(parts) != 2:
                  raise RuntimeError(
                      f"Invalid Thunderstore package: "
                      f"{name}"
                  )

              author, package = parts

              url = (
                  "https://thunderstore.io/"
                  "package/download/"
                  f"{author}/{package}/"
                  f"{version_string}/"
              )

              filename = (
                  DOWNLOADS /
                  (
                      f"{author}-"
                      f"{package}-"
                      f"{version_string}.zip"
                  )
              )

              print()
              print("=" * 70)
              print(
                  f"[{index}/{total}] "
                  f"{name} {version_string}"
              )
              print(f"URL: {url}")
              print("=" * 70)

              data = download(url)

              filename.write_bytes(data)

              size_mb = (
                  filename.stat().st_size
                  / (1024 * 1024)
              )

              print(
                  f"Downloaded: "
                  f"{size_mb:.2f} MB"
              )

              install_package(filename)

          # Copy profile-specific files.
          print()
          print("=" * 70)
          print("Copying profile-specific files")
          print("=" * 70)

          profile_root = Path(
              "work/profile"
          )

          if (
              profile_root / "BepInEx"
          ).is_dir():
              merge_tree(
                  profile_root / "BepInEx",
                  PACK / "BepInEx"
              )

          if (
              profile_root / "config"
          ).is_dir():
              merge_tree(
                  profile_root / "config",
                  PACK / "BepInEx" / "config"
              )

          print()
          print("=" * 70)
          print("Standalone pack assembled")
          print("=" * 70)

          files = [
              p
              for p in PACK.rglob("*")
              if p.is_file()
          ]

          total_size = sum(
              p.stat().st_size
              for p in files
          )

          total_mb = (
              total_size
              / (1024 * 1024)
          )

          print(f"Files: {len(files)}")
          print(f"Size: {total_mb:.2f} MB")
          print(f"Profile: {profile_name}")
          PY

      - name: Verify standalone pack
        run: |
          set -euo pipefail

          echo "Pack size:"
          du -sh pack

          echo
          echo "Pack structure:"
          find pack -maxdepth 4 -type f | sort | head -200

          echo
          echo "Checking BepInEx..."

          test -d pack/BepInEx

          echo "BepInEx: OK"

          if [[ -d pack/BepInEx/plugins ]]; then
            echo "BepInEx/plugins: OK"
          fi

          if [[ -d pack/BepInEx/config ]]; then
            echo "BepInEx/config: OK"
          fi

      - name: Generate pack information
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="build-${GITHUB_RUN_NUMBER}"
          fi

          cat > pack/VALHEIM-MODPACK.txt <<EOF
          Valheim Standalone Modpack

          Profile code:
          ${{ steps.profile.outputs.code }}

          Version:
          ${VERSION}

          Git commit:
          ${GITHUB_SHA}

          GitHub Actions run:
          ${GITHUB_RUN_NUMBER}

          Generated:
          $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          Installation:

          1. Install Valheim.
          2. Extract this archive into the Valheim game directory.
          3. Launch Valheim through BepInEx.

          This archive contains the downloaded
          Thunderstore mod files and profile configuration.
          EOF

      - name: Create standalone ZIP
        id: zip
        run: |
          set -euo pipefail

          mkdir -p release

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="build-${GITHUB_RUN_NUMBER}"
          fi

          ZIP="Valheim-Standalone-Modpack-${VERSION}.zip"

          echo "Creating ${ZIP}"

          cd pack

          zip \
            -r \
            -9 \
            "../release/${ZIP}" \
            .

          cd ..

          SIZE=$(stat -c%s "release/${ZIP}")

          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"

          echo
          echo "Final ZIP:"
          ls -lh "release/${ZIP}"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Valheim-Standalone-Modpack-${{ steps.zip.outputs.version }}
          path: release/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # GitHub Releases are TAG ONLY.
      # main push -> artifact only
      # v1.0.0 tag -> artifact + GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Valheim Modpack ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
